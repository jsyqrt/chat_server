# MongoDB配置文件
# 参考文档: https://docs.mongodb.com/manual/reference/configuration-options/

# 存储设置
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1  # 缓存大小，根据可用内存调整

# 系统日志设置
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen

# 网络设置
net:
  port: 27017
  bindIp: 0.0.0.0  # 允许所有IP连接，生产环境应配置特定IP

# 安全设置
security:
  authorization: enabled  # 启用认证

# 操作配置
operationProfiling:
  slowOpThresholdMs: 100  # 慢查询阈值(毫秒)
  mode: slowOp  # 记录慢查询

# 进程管理
processManagement:
  timeZoneInfo: /usr/share/zoneinfo