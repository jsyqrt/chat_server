version: '3.8'

services:
  # Zchat应用服务
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: zchat-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./zchat:/app/zchat
      - ./scripts:/app/scripts
      - ./migrations:/app/migrations
      - ./instance:/app/instance
      - app_logs:/app/log
    env_file:
      - .env
    networks:
      - zchat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx反向代理
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: zchat-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd
      - ./certbot-webroot:/var/www/html
      - ./docker/nginx/nginx.conf.${DEPLOY_MODE:-prod}:/etc/nginx/conf.d/default.conf
    networks:
      - zchat-network

  # MySQL数据库 - 存储结构化数据和文档数据
  mysql:
    image: mysql:8.0
    container_name: zchat-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=zchat
      - MYSQL_USER=zchat
      - MYSQL_PASSWORD=zchat_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf:/etc/mysql/conf.d
    networks:
      - zchat-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "zchat", "-pzchat_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE: 允许提高进程优先级以及更改其他进程的优先级

  # MongoDB数据库 - 用于NoSQL文档存储
  mongodb:
    image: mongo:6.0
    container_name: zchat-mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=zchat
      - MONGO_INITDB_ROOT_PASSWORD=zchat_password
      - MONGO_INITDB_DATABASE=zchat
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d
    networks:
      - zchat-network
    ports:
      - "27017:27017"  # TODO remove this
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "'db.adminCommand(\"ping\")'", "-u", "zchat", "-p", "zchat_password", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["--auth", "--bind_ip_all"]

  # Prometheus监控
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: zchat-prometheus
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
    networks:
      - zchat-network

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: zchat-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - zchat-network

  # Grafana可视化
  grafana:
    image: grafana/grafana:10.4.0
    container_name: zchat-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
    networks:
      - zchat-network

  # Redis服务 - 用于缓存和共享状态
  redis:
    image: redis:7.0
    container_name: zchat-redis
    restart: always
    command: redis-server --requirepass zchat_password
    volumes:
      - redis_data:/data
    networks:
      - zchat-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "zchat_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# 网络配置
networks:
  zchat-network:
    driver: bridge

# 命名卷配置 - 解决权限问题的最佳方案
volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  grafana_data:
  prometheus_data:
  app_logs: