<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优化简历</title>
    <style>
        /* 全局样式 */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --text-color: #333;
            --border-color: #ddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: var(--text-color);
            line-height: 1.6;
        }

        /* A4纸大小设置 */
        .resume-container {
            width: 210mm;
            min-height: 297mm;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 20mm;
            position: relative;
        }

        /* 头部样式 */
        .resume-header {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary-color);
        }

        .resume-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            font-size: 14px;
        }

        .contact-item {
            display: flex;
            align-items: center;
        }

        .contact-item i {
            margin-right: 5px;
            color: var(--secondary-color);
        }

        /* 主体内容布局 - 修改为左侧为side-column */
        .resume-body {
            display: grid;
            grid-template-columns: 3fr 7fr;
            gap: 20px;
        }

        .main-column,
        .side-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 内容区块样式 */
        .resume-section {
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .section-title i {
            margin-right: 8px;
            color: var(--secondary-color);
        }

        /* 经验区块样式 */
        .experience-item,
        .education-item,
        .project-item,
        .publication-item,
        .award-item,
        .volunteer-item,
        .certification-item {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed var(--border-color);
        }

        .experience-item:last-child,
        .education-item:last-child,
        .project-item:last-child,
        .publication-item:last-child,
        .award-item:last-child,
        .volunteer-item:last-child,
        .certification-item:last-child {
            border-bottom: none;
        }

        .exp-header,
        .edu-header,
        .proj-header,
        .pub-header,
        .award-header,
        .vol-header,
        .cert-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .exp-title,
        .edu-degree,
        .proj-name,
        .pub-title,
        .award-name,
        .vol-role,
        .cert-name {
            font-weight: 600;
            color: var(--secondary-color);
        }

        .exp-date,
        .edu-date,
        .proj-date,
        .pub-date,
        .award-date,
        .vol-date,
        .cert-date {
            color: #777;
            font-size: 14px;
        }

        .exp-company,
        .edu-institution,
        .proj-role,
        .pub-publisher,
        .award-issuer,
        .vol-organization,
        .cert-issuer {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .exp-location,
        .edu-location {
            font-style: italic;
            color: #777;
            font-size: 14px;
        }

        .exp-description,
        .edu-description,
        .proj-description,
        .pub-description,
        .award-description,
        .vol-description {
            margin-top: 8px;
            font-size: 14px;
        }

        .exp-bullets,
        .proj-bullets {
            margin-top: 8px;
            padding-left: 20px;
        }

        .exp-bullets li,
        .proj-bullets li {
            margin-bottom: 5px;
            font-size: 14px;
        }

        .technologies {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tech-tag {
            background-color: var(--light-color);
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        /* 技能样式 */
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-item {
            background-color: var(--light-color);
            color: var(--primary-color);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 14px;
        }

        /* 个人信息和语言样式 */
        .personal-info-list,
        .languages-list {
            list-style-type: none;
        }

        .personal-info-list li,
        .languages-list li {
            margin-bottom: 5px;
            font-size: 14px;
            display: flex;
        }

        .info-label,
        .language-name {
            font-weight: 500;
            width: 40%;
        }

        .info-value,
        .language-proficiency {
            width: 60%;
        }

        /* 自我评价样式 */
        .self-evaluation {
            font-style: italic;
            line-height: 1.6;
            font-size: 14px;
        }

        /* 兴趣和优势弱点样式 */
        .interests-list,
        .strengths-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .interest-item,
        .strength-item {
            background-color: var(--light-color);
            color: var(--primary-color);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 14px;
        }

        /* 打印样式优化 */
        @media print {
            body {
                background-color: white;
            }

            .resume-container {
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 15mm;
                box-shadow: none;
                page-break-inside: avoid;
            }

            .page-break {
                page-break-before: always;
            }
        }

        /* 响应式设计 */
        @media (max-width: 210mm) {
            .resume-container {
                width: 100%;
                padding: 15px;
                margin: 0;
                box-shadow: none;
            }

            .resume-body {
                grid-template-columns: 1fr;
            }

            .contact-info {
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>

<body>
    <div class="resume-container" id="resume">
        <div class="resume-header">
            <h1 class="resume-name" id="name">加载中...</h1>
            <div class="contact-info" id="contactInfo">
                <!-- 联系信息将在这里动态生成 -->
            </div>
        </div>

        <div class="resume-body">
            <div class="side-column">
                <!-- 个人信息 -->
                <div class="resume-section" id="personalInfoSection">
                    <h2 class="section-title"><i class="fas fa-info-circle"></i>个人信息</h2>
                    <ul class="personal-info-list" id="personalInfoList">
                        <!-- 个人信息将在这里动态生成 -->
                    </ul>
                </div>

                <!-- 自我评价 -->
                <div class="resume-section" id="selfEvaluationSection">
                    <h2 class="section-title"><i class="fas fa-user"></i>自我评价</h2>
                    <p class="self-evaluation" id="selfEvaluation">加载中...</p>
                </div>

                <!-- 技能部分 -->
                <div class="resume-section" id="skillsSection">
                    <h2 class="section-title"><i class="fas fa-cogs"></i>专业技能</h2>

                    <div id="technicalSkills">
                        <h3 style="font-size: 16px; margin-top: 10px; margin-bottom: 5px;">技术技能</h3>
                        <div class="skills-list" id="technicalSkillsList">
                            <!-- 技术技能将在这里动态生成 -->
                        </div>
                    </div>

                    <div id="softSkills">
                        <h3 style="font-size: 16px; margin-top: 10px; margin-bottom: 5px;">软技能</h3>
                        <div class="skills-list" id="softSkillsList">
                            <!-- 软技能将在这里动态生成 -->
                        </div>
                    </div>

                    <div id="otherSkills">
                        <h3 style="font-size: 16px; margin-top: 10px; margin-bottom: 5px;">其他技能</h3>
                        <div class="skills-list" id="otherSkillsList">
                            <!-- 其他技能将在这里动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 证书 -->
                <div class="resume-section" id="certificationsSection">
                    <h2 class="section-title"><i class="fas fa-certificate"></i>证书</h2>
                    <div id="certificationsList">
                        <!-- 证书将在这里动态生成 -->
                    </div>
                </div>

                <!-- 语言能力 -->
                <div class="resume-section" id="languagesSection">
                    <h2 class="section-title"><i class="fas fa-language"></i>语言能力</h2>
                    <ul class="languages-list" id="languagesList">
                        <!-- 语言能力将在这里动态生成 -->
                    </ul>
                </div>

                <!-- 兴趣爱好 -->
                <div class="resume-section" id="interestsSection">
                    <h2 class="section-title"><i class="fas fa-heart"></i>兴趣爱好</h2>
                    <div class="interests-list" id="interestsList">
                        <!-- 兴趣爱好将在这里动态生成 -->
                    </div>
                </div>

                <!-- 个人优势 -->
                <div class="resume-section" id="strengthsSection">
                    <h2 class="section-title"><i class="fas fa-star"></i>个人优势</h2>
                    <div class="strengths-list" id="strengthsList">
                        <!-- 个人优势将在这里动态生成 -->
                    </div>
                </div>

                <!-- 获奖情况 -->
                <div class="resume-section" id="awardsSection">
                    <h2 class="section-title"><i class="fas fa-trophy"></i>获奖情况</h2>
                    <div id="awardsList">
                        <!-- 获奖情况将在这里动态生成 -->
                    </div>
                </div>

            </div>

            <div class="main-column">
                <!-- 教育背景 -->
                <div class="resume-section" id="educationSection">
                    <h2 class="section-title"><i class="fas fa-graduation-cap"></i>教育背景</h2>
                    <div id="educationList">
                        <!-- 教育背景将在这里动态生成 -->
                    </div>
                </div>

                <!-- 工作经验 -->
                <div class="resume-section" id="experienceSection">
                    <h2 class="section-title"><i class="fas fa-briefcase"></i>工作经验</h2>
                    <div id="experienceList">
                        <!-- 工作经验将在这里动态生成 -->
                    </div>
                </div>

                <!-- 项目经验 -->
                <div class="resume-section" id="projectsSection">
                    <h2 class="section-title"><i class="fas fa-project-diagram"></i>项目经验</h2>
                    <div id="projectsList">
                        <!-- 项目经验将在这里动态生成 -->
                    </div>
                </div>

                <!-- 出版物 -->
                <div class="resume-section" id="publicationsSection">
                    <h2 class="section-title"><i class="fas fa-book"></i>出版物</h2>
                    <div id="publicationsList">
                        <!-- 出版物将在这里动态生成 -->
                    </div>
                </div>

                <!-- 志愿者经验 -->
                <div class="resume-section" id="volunteerSection">
                    <h2 class="section-title"><i class="fas fa-hands-helping"></i>志愿者经验</h2>
                    <div id="volunteerList">
                        <!-- 志愿者经验将在这里动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 从同目录下加载JSON文件
            fetch('resume.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('无法加载简历数据，请确保resume.json文件在同一目录下');
                    }
                    return response.json();
                })
                .then(resumeData => {
                    renderResume(resumeData);
                })
                .catch(error => {
                    console.error('加载简历数据时出错:', error);
                    document.body.innerHTML = `
                        <div style="text-align: center; margin-top: 50px; color: red;">
                            <h2>错误</h2>
                            <p>${error.message}</p>
                        </div>
                    `;
                });
        });

        function renderResume(data) {
            // 渲染姓名
            document.getElementById('name').textContent = data.name || '';

            // 渲染联系信息
            const contactInfo = document.getElementById('contactInfo');
            contactInfo.innerHTML = '';

            if (data.contact) {
                if (data.contact.email) {
                    contactInfo.innerHTML += `<div class="contact-item"><i class="fas fa-envelope"></i> ${data.contact.email}</div>`;
                }
                if (data.contact.phone) {
                    contactInfo.innerHTML += `<div class="contact-item"><i class="fas fa-phone"></i> ${data.contact.phone}</div>`;
                }
                if (data.contact.linkedin) {
                    contactInfo.innerHTML += `<div class="contact-item"><i class="fab fa-linkedin"></i> <a href="${data.contact.linkedin}" target="_blank">LinkedIn</a></div>`;
                }
                if (data.contact.github) {
                    contactInfo.innerHTML += `<div class="contact-item"><i class="fab fa-github"></i> <a href="${data.contact.github}" target="_blank">GitHub</a></div>`;
                }
                if (data.contact.website) {
                    contactInfo.innerHTML += `<div class="contact-item"><i class="fas fa-globe"></i> <a href="${data.contact.website}" target="_blank">个人网站</a></div>`;
                }
                if (data.contact.address) {
                    contactInfo.innerHTML += `<div class="contact-item"><i class="fas fa-map-marker-alt"></i> ${data.contact.address}</div>`;
                }
            }

            // 渲染自我评价
            const selfEvaluation = document.getElementById('selfEvaluation');
            selfEvaluation.textContent = data.self_evaluation || '';
            toggleSectionVisibility('selfEvaluationSection', Boolean(data.self_evaluation));

            // 渲染工作经验
            const experienceList = document.getElementById('experienceList');
            experienceList.innerHTML = '';

            if (data.experience && data.experience.length > 0) {
                data.experience.forEach(exp => {
                    const dateRange = `${exp.start_date || ''} - ${exp.end_date || '至今'}`;

                    let html = `
                        <div class="experience-item">
                            <div class="exp-header">
                                <div class="exp-title">${exp.title || ''}</div>
                                <div class="exp-date">${dateRange}</div>
                    `;

                    if (exp.location) {
                        html += `<div class="exp-location">${exp.location}</div>`;
                    }

                    html += `
                            </div>
                            <div class="exp-company">${exp.organization || ''}</div>
                    `;

                    if (exp.description) {
                        html += `<div class="exp-description">${exp.description}</div>`;
                    }

                    if (exp.responsibilities && exp.responsibilities.length > 0) {
                        html += '<ul class="exp-bullets">';
                        exp.responsibilities.forEach(responsibility => {
                            html += `<li>${responsibility}</li>`;
                        });
                        html += '</ul>';
                    }

                    if (exp.achievements && exp.achievements.length > 0) {
                        html += '<div style="margin-top: 8px;"><strong>成就：</strong></div>';
                        html += '<ul class="exp-bullets">';
                        exp.achievements.forEach(achievement => {
                            html += `<li>${achievement}</li>`;
                        });
                        html += '</ul>';
                    }

                    if (exp.technologies && exp.technologies.length > 0) {
                        html += '<div class="technologies">';
                        exp.technologies.forEach(tech => {
                            html += `<span class="tech-tag">${tech}</span>`;
                        });
                        html += '</div>';
                    }

                    html += '</div>';
                    experienceList.innerHTML += html;
                });
            }
            toggleSectionVisibility('experienceSection', Boolean(data.experience && data.experience.length > 0));

            // 渲染项目经验
            const projectsList = document.getElementById('projectsList');
            projectsList.innerHTML = '';

            if (data.projects && data.projects.length > 0) {
                data.projects.forEach(project => {
                    const dateRange = `${project.start_date || ''} - ${project.end_date || '至今'}`;

                    let html = `
                        <div class="project-item">
                            <div class="proj-header">
                                <div class="proj-name">${project.name || ''}</div>
                                <div class="proj-date">${dateRange}</div>
                            </div>
                    `;

                    if (project.role) {
                        html += `<div class="proj-role">${project.role}</div>`;
                    }

                    if (project.description) {
                        html += `<div class="proj-description">${project.description}</div>`;
                    }

                    if (project.achievements && project.achievements.length > 0) {
                        html += '<ul class="proj-bullets">';
                        project.achievements.forEach(achievement => {
                            html += `<li>${achievement}</li>`;
                        });
                        html += '</ul>';
                    }

                    if (project.technologies && project.technologies.length > 0) {
                        html += '<div class="technologies">';
                        project.technologies.forEach(tech => {
                            html += `<span class="tech-tag">${tech}</span>`;
                        });
                        html += '</div>';
                    }

                    if (project.url) {
                        html += `<div style="margin-top: 5px; font-size: 14px;"><a href="${project.url}" target="_blank">项目链接</a></div>`;
                    }

                    html += '</div>';
                    projectsList.innerHTML += html;
                });
            }
            toggleSectionVisibility('projectsSection', Boolean(data.projects && data.projects.length > 0));

            // 渲染教育背景
            const educationList = document.getElementById('educationList');
            educationList.innerHTML = '';

            if (data.education && data.education.length > 0) {
                data.education.forEach(edu => {
                    const dateRange = `${edu.start_date || ''} - ${edu.end_date || '至今'}`;

                    let html = `
                        <div class="education-item">
                            <div class="edu-header">
                                <div class="edu-degree">${edu.degree || ''} ${edu.field_of_study ? `· ${edu.field_of_study}` : ''}</div>
                                <div class="edu-date">${dateRange}</div>
                    `
                    // if (edu.location) {
                    //     html += `<div class="edu-location">${edu.location}</div>`;
                    // }
                    html += `
                            </div>
                            <div class="edu-institution">${edu.institution || ''}</div>
                    `;

                    if (edu.gpa) {
                        html += `<div style="margin-top: 5px; font-size: 14px;"><strong>GPA:</strong> ${edu.gpa}</div>`;
                    }

                    if (edu.details) {
                        html += `<div class="edu-description">${edu.details}</div>`;
                    }

                    html += '</div>';
                    educationList.innerHTML += html;
                });
            }
            toggleSectionVisibility('educationSection', Boolean(data.education && data.education.length > 0));

            // 渲染技能
            const technicalSkillsList = document.getElementById('technicalSkillsList');
            const softSkillsList = document.getElementById('softSkillsList');
            const otherSkillsList = document.getElementById('otherSkillsList');

            technicalSkillsList.innerHTML = '';
            softSkillsList.innerHTML = '';
            otherSkillsList.innerHTML = '';

            if (data.skills) {
                if (data.skills.technical && data.skills.technical.length > 0) {
                    data.skills.technical.forEach(skill => {
                        technicalSkillsList.innerHTML += `<span class="skill-item">${skill}</span>`;
                    });
                } else {
                    document.getElementById('technicalSkills').style.display = 'none';
                }

                if (data.skills.soft && data.skills.soft.length > 0) {
                    data.skills.soft.forEach(skill => {
                        softSkillsList.innerHTML += `<span class="skill-item">${skill}</span>`;
                    });
                } else {
                    document.getElementById('softSkills').style.display = 'none';
                }

                if (data.skills.other && data.skills.other.length > 0) {
                    data.skills.other.forEach(skill => {
                        otherSkillsList.innerHTML += `<span class="skill-item">${skill}</span>`;
                    });
                } else {
                    document.getElementById('otherSkills').style.display = 'none';
                }
            }
            toggleSectionVisibility('skillsSection', Boolean(data.skills &&
                ((data.skills.technical && data.skills.technical.length > 0) ||
                    (data.skills.soft && data.skills.soft.length > 0) ||
                    (data.skills.other && data.skills.other.length > 0))));

            // 渲染语言能力
            const languagesList = document.getElementById('languagesList');
            languagesList.innerHTML = '';

            if (data.personal_info && data.personal_info.languages && data.personal_info.languages.length > 0) {
                data.personal_info.languages.forEach(lang => {
                    languagesList.innerHTML += `
                        <li>
                            <span class="language-name">${lang.language || ''}:</span>
                            <span class="language-proficiency">${lang.proficiency || ''}</span>
                        </li>
                    `;
                });
            }
            toggleSectionVisibility('languagesSection', Boolean(data.personal_info && data.personal_info.languages && data.personal_info.languages.length > 0));

            // 渲染个人信息
            const personalInfoList = document.getElementById('personalInfoList');
            personalInfoList.innerHTML = '';

            if (data.personal_info) {
                if (data.personal_info.nationality) {
                    personalInfoList.innerHTML += `
                        <li>
                            <span class="info-label">国籍:</span>
                            <span class="info-value">${data.personal_info.nationality}</span>
                        </li>
                    `;
                }

                if (data.personal_info.other_details && data.personal_info.other_details.length > 0) {
                    data.personal_info.other_details.forEach(detail => {
                        personalInfoList.innerHTML += `
                            <li>
                                <span class="info-label">${detail.name || ''}:</span>
                                <span class="info-value">${detail.value || ''}</span>
                            </li>
                        `;
                    });
                }
            }
            toggleSectionVisibility('personalInfoSection', Boolean(personalInfoList.innerHTML !== ''));

            // 渲染兴趣爱好
            const interestsList = document.getElementById('interestsList');
            interestsList.innerHTML = '';

            if (data.interests && data.interests.length > 0) {
                data.interests.forEach(interest => {
                    interestsList.innerHTML += `<span class="interest-item">${interest}</span>`;
                });
            }
            toggleSectionVisibility('interestsSection', Boolean(data.interests && data.interests.length > 0));

            // 渲染个人优势
            const strengthsList = document.getElementById('strengthsList');
            strengthsList.innerHTML = '';

            if (data.good_at && data.good_at.length > 0) {
                data.good_at.forEach(strength => {
                    strengthsList.innerHTML += `<span class="strength-item">${strength}</span>`;
                });
            }
            toggleSectionVisibility('strengthsSection', Boolean(data.good_at && data.good_at.length > 0));

            // 渲染证书
            const certificationsList = document.getElementById('certificationsList');
            certificationsList.innerHTML = '';

            if (data.certifications && data.certifications.length > 0) {
                data.certifications.forEach(cert => {
                    let html = `
                        <div class="certification-item">
                            <div class="cert-header">
                                <div class="cert-name">${cert.name || ''}</div>
                                <div class="cert-date">${cert.date || ''}</div>
                            </div>
                            <div class="cert-issuer">${cert.issuer || ''}</div>
                    `;

                    if (cert.expiration) {
                        html += `<div style="font-size: 14px;">有效期至: ${cert.expiration}</div>`;
                    }

                    if (cert.id) {
                        html += `<div style="font-size: 14px;">证书ID: ${cert.id}</div>`;
                    }

                    if (cert.url) {
                        html += `<div style="margin-top: 5px; font-size: 14px;"><a href="${cert.url}" target="_blank">查看证书</a></div>`;
                    }

                    html += '</div>';
                    certificationsList.innerHTML += html;
                });
            }
            toggleSectionVisibility('certificationsSection', Boolean(data.certifications && data.certifications.length > 0));

            // 渲染出版物
            const publicationsList = document.getElementById('publicationsList');
            publicationsList.innerHTML = '';

            if (data.publications && data.publications.length > 0) {
                data.publications.forEach(pub => {
                    let html = `
                        <div class="publication-item">
                            <div class="pub-header">
                                <div class="pub-title">${pub.title || ''}</div>
                                <div class="pub-date">${pub.date || ''}</div>
                            </div>
                            <div class="pub-publisher">${pub.publisher || ''}</div>
                    `;

                    if (pub.authors && pub.authors.length > 0) {
                        html += `<div style="font-size: 14px;">作者: ${pub.authors.join(', ')}</div>`;
                    }

                    if (pub.description) {
                        html += `<div class="pub-description">${pub.description}</div>`;
                    }

                    if (pub.url) {
                        html += `<div style="margin-top: 5px; font-size: 14px;"><a href="${pub.url}" target="_blank">查看出版物</a></div>`;
                    }

                    html += '</div>';
                    publicationsList.innerHTML += html;
                });
            }
            toggleSectionVisibility('publicationsSection', Boolean(data.publications && data.publications.length > 0));

            // 渲染获奖情况
            const awardsList = document.getElementById('awardsList');
            awardsList.innerHTML = '';

            if (data.awards && data.awards.length > 0) {
                data.awards.forEach(award => {
                    let html = `
                        <div class="award-item">
                            <div class="award-header">
                                <div class="award-name">${award.name || ''}</div>
                                <div class="award-date">${award.date || ''}</div>
                            </div>
                            <div class="award-issuer">${award.issuer || ''}</div>
                    `;

                    if (award.description) {
                        html += `<div class="award-description">${award.description}</div>`;
                    }

                    html += '</div>';
                    awardsList.innerHTML += html;
                });
            }
            toggleSectionVisibility('awardsSection', Boolean(data.awards && data.awards.length > 0));

            // 渲染志愿者经验
            const volunteerList = document.getElementById('volunteerList');
            volunteerList.innerHTML = '';

            if (data.volunteer_experience && data.volunteer_experience.length > 0) {
                data.volunteer_experience.forEach(vol => {
                    const dateRange = `${vol.start_date || ''} - ${vol.end_date || '至今'}`;

                    let html = `
                        <div class="volunteer-item">
                            <div class="vol-header">
                                <div class="vol-role">${vol.role || ''}</div>
                                <div class="vol-date">${dateRange}</div>
                            </div>
                            <div class="vol-organization">${vol.organization || ''}</div>
                    `;

                    if (vol.description) {
                        html += `<div class="vol-description">${vol.description}</div>`;
                    }

                    html += '</div>';
                    volunteerList.innerHTML += html;
                });
            }
            toggleSectionVisibility('volunteerSection', Boolean(data.volunteer_experience && data.volunteer_experience.length > 0));
        }

        // 根据内容控制区块显示/隐藏
        function toggleSectionVisibility(sectionId, hasContent) {
            const section = document.getElementById(sectionId);
            if (section) {
                section.style.display = hasContent ? 'block' : 'none';
            }
        }
    </script>
</body>

</html>
