<!DOCTYPE html>
<html lang="{{ g.get('lang', 'zh_CN') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Reset Password') }} - VoyLead</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 0.5rem;
            display: none;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .footer {
            margin-top: 2rem;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ _('Reset Password') }}</h1>
        <form id="resetForm" onsubmit="return handleSubmit(event)">
            <div class="form-group">
                <label for="new_password">{{ _('New Password') }}</label>
                <input type="password" id="new_password" name="new_password" required minlength="8">
                <div class="error-message" id="password-error">{{ _('Password must be at least 8 characters long') }}</div>
            </div>
            <div class="form-group">
                <label for="confirm_password">{{ _('Confirm Password') }}</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
                <div class="error-message" id="confirm-error">{{ _('Passwords do not match') }}</div>
            </div>
            <input type="hidden" id="token" name="token" value="{{ token }}">
            <button type="submit" class="button" id="submitButton">{{ _('Reset Password') }}</button>
        </form>
        <div class="footer">
            <p>{{ _('Thank you for using VoyLead') }}</p>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();

            // 重置错误信息
            document.getElementById('password-error').style.display = 'none';
            document.getElementById('confirm-error').style.display = 'none';

            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const token = document.getElementById('token').value;

            // 验证密码长度
            if (newPassword.length < 8) {
                document.getElementById('password-error').style.display = 'block';
                return false;
            }

            // 验证两次密码是否一致
            if (newPassword !== confirmPassword) {
                document.getElementById('confirm-error').style.display = 'block';
                return false;
            }

            // 禁用提交按钮
            const submitButton = document.getElementById('submitButton');
            submitButton.disabled = true;
            submitButton.textContent = '{{ _("Processing...") }}';

            // 发送请求
            fetch(window.location.href, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'token': token,
                    'new_password': newPassword
                }),
                redirect: 'follow'
            })
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                } else if (!response.ok) {
                    throw new Error('Network response was not ok');
                } else {
                    return response.text().then(html => {
                        document.documentElement.innerHTML = html;
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                submitButton.disabled = false;
                submitButton.textContent = '{{ _("Reset Password") }}';
                alert('{{ _("Failed to reset password. Please try again later.") }}');
            });

            return false;
        }
    </script>
</body>
</html>
